name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The repo already carries the built bundle, so packaging needs no rebuild.
      - name: Pack
        run: npm pack
      # Idempotent: creates the release on the first tag push, otherwise just
      # replaces the asset.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-ai-stack-skills-*.tgz --clobber
          else
            gh release create "$TAG" dsh-ai-stack-skills-*.tgz \
              --title "$TAG" --notes-file CHANGELOG.md --verify-tag
          fi
